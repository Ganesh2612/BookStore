<mat-toolbar class="toolbar">
  <div class="head">
    <a routerLink="/home"
      ><img src="education@2x.png" alt="Logo" class="logo"
    /></a>
    <a routerLink="/home"><span class="title">Bookstore</span></a>
  </div>

  <div class="search-bar">
    <mat-icon class="search-icon">search</mat-icon>
    <input matInput placeholder="Search" />
  </div>

  <div class="icons">
   <div class="icon-item">
 <button mat-icon-button [matMenuTriggerFor]="accountMenu">
  <mat-icon>account_circle</mat-icon>
</button>

  
  <span>{{ isLoggedIn ? userName : "Profile" }}</span>
</div>

    <div class="icon-item">
      <button mat-icon-button><mat-icon>shopping_cart</mat-icon></button>
      <span>Cart</span>
    </div>
  </div>
</mat-toolbar>

<mat-menu #accountMenu="matMenu" class="account-menu">
  <div class="menu-header">Hello {{ userName }},</div>
  <button mat-menu-item [routerLink]="['/user-profile']">
    <mat-icon>person</mat-icon>
    <span>Profile</span>
  </button>
  <button mat-menu-item>
    <mat-icon>assignment</mat-icon>
    <span>My Orders</span>
  </button>
  <button mat-menu-item [routerLink]="['/wishlist']">
    <mat-icon>favorite_border</mat-icon>
    <span>My Wishlist</span>
  </button>
  <mat-divider></mat-divider>
  <div class="menu-logout-wrapper">
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>
</mat-menu>
